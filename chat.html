<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💚 يوسف & زوتي — الشات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #050807;
    --bg-deep: #0a120d;
    --bg-elev: rgba(0, 255, 136, 0.04);
    --card-bg: rgba(0, 255, 136, 0.04);
    --card-border: rgba(0, 255, 136, 0.15);
    --text-primary: #e8fff5;
    --text-secondary: rgba(232, 255, 245, 0.55);
    --input-bg: rgba(0, 255, 136, 0.04);
    --input-border: rgba(0, 255, 136, 0.18);
    --accent-1: #00ff88;
    --accent-2: #00cc6a;
    --accent-3: #0aff9d;
    --accent-glow: rgba(0, 255, 136, 0.4);
    --success: #00ff88;
    --error: #ff4757;
    --shadow: 0 25px 70px rgba(0, 255, 136, 0.15);
    --my-msg: linear-gradient(135deg, #00ff88, #00cc6a);
    --other-msg: rgba(0, 255, 136, 0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
  html, body { min-height:100vh; overflow:hidden; background:var(--bg-base); }

  .bg-grid {
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 50px 50px; }
  }
  .bg-glow {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,255,136,0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,204,106,0.06) 0%, transparent 40%);
    animation: glowPulse 6s ease-in-out infinite alternate;
  }
  @keyframes glowPulse { from{opacity:.5} to{opacity:1} }

  /* Toast */
  .toast-container {
    position:fixed; top:24px; right:24px; z-index:10000;
    display:flex; flex-direction:column; gap:10px;
  }
  .toast {
    min-width:280px; padding:14px 18px; border-radius:12px;
    background: var(--card-bg); border:1px solid var(--card-border);
    backdrop-filter: blur(20px); color: var(--text-primary);
    display:flex; align-items:center; gap:12px;
    font-size:14px; font-weight:500;
    box-shadow: var(--shadow);
    animation: toastIn .4s cubic-bezier(.34,1.56,.64,1);
    border-right: 3px solid var(--accent-1);
  }
  .toast.success { border-right-color: var(--success); }
  .toast.error { border-right-color: var(--error); }
  @keyframes toastIn { from{transform:translateX(120%); opacity:0} to{transform:translateX(0); opacity:1} }
  @keyframes toastOut { to{transform:translateX(120%); opacity:0} }

  /* Image modal */
  .img-modal {
    position:fixed; inset:0; z-index:20000; background:rgba(0,0,0,.92);
    display:none; align-items:center; justify-content:center; padding:20px;
    cursor:zoom-out;
  }
  .img-modal.show { display:flex; animation: fadeIn .3s; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .img-modal img { max-width:95vw; max-height:95vh; border-radius:16px; }

  /* Chat Layout */
  .chat-wrap {
    position:relative; z-index:10; height:100vh; padding:16px;
  }
  .chat-app {
    width:min(1200px, 100%); height:100%; margin:0 auto;
    display:grid; grid-template-columns: 300px 1fr;
    background: var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:20px;
    backdrop-filter: blur(30px) saturate(180%);
    box-shadow: var(--shadow);
    overflow:hidden;
    animation: appIn .6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes appIn { from{opacity:0; transform:scale(.97)} to{opacity:1; transform:scale(1)} }

  /* Sidebar */
  .sidebar {
    background: rgba(5,8,7,0.6);
    border-left:1px solid var(--card-border);
    padding:22px 16px;
    display:flex; flex-direction:column;
    overflow-y:auto;
  }
  .sidebar::-webkit-scrollbar { width:4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--accent-1); border-radius:2px; }

  .brand {
    display:flex; align-items:center; gap:12px;
    padding-bottom:18px;
    border-bottom:1px solid var(--card-border);
    margin-bottom:18px;
  }
  .brand-icon {
    width:44px; height:44px; border-radius:12px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .brand-text h2 {
    font-size:16px; font-weight:800; color:var(--text-primary);
    letter-spacing:0.5px;
  }
  .brand-text p { font-size:11px; color:var(--text-secondary); }

  .me-card {
    display:flex; align-items:center; gap:12px;
    padding:14px;
    background: var(--bg-elev);
    border:1px solid var(--card-border);
    border-radius:14px;
    margin-bottom:20px;
  }
  .me-avatar {
    width:44px; height:44px; border-radius:50%;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
    box-shadow: 0 6px 16px var(--accent-glow);
    flex-shrink:0;
  }
  .me-info { flex:1; min-width:0; }
  .me-info b {
    display:block; color: var(--text-primary);
    font-size:14px; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .me-info span {
    display:block; color:var(--text-secondary);
    font-size:11px;
    display:flex; align-items:center; gap:4px;
  }
  .me-info span::before {
    content:''; width:6px; height:6px; border-radius:50%;
    background: var(--success); box-shadow:0 0 8px var(--success);
  }

  .stats-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-bottom:20px;
  }
  .stat-box {
    background: var(--bg-elev);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:14px 10px;
    text-align:center;
  }
  .stat-box .num {
    font-size:22px; font-weight:800;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-3));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    line-height:1.1; margin-bottom:4px;
  }
  .stat-box .lbl {
    font-size:10px; color:var(--text-secondary);
    letter-spacing:0.5px;
  }

  .sidebar-actions {
    margin-top:auto;
    display:flex; flex-direction:column; gap:8px;
    padding-top:16px;
    border-top:1px solid var(--card-border);
  }
  .sb-btn {
    display:flex; align-items:center; gap:10px;
    padding:11px 14px; border-radius:10px;
    background: transparent;
    border:1px solid var(--card-border);
    color: var(--text-secondary);
    cursor:pointer; font-family:inherit;
    font-size:13px; font-weight:600;
    transition: all .3s; text-align:right;
  }
  .sb-btn:hover {
    background: var(--bg-elev);
    color: var(--text-primary);
    border-color: var(--accent-1);
  }
  .sb-btn.danger:hover {
    background: rgba(255,71,87,0.08);
    color: var(--error);
    border-color: var(--error);
  }
  .sb-btn .ico { font-size:16px; }

  /* Chat Main */
  .chat-main {
    display:flex; flex-direction:column;
    background: rgba(5,8,7,0.3);
    position:relative;
    overflow:hidden;
  }

  .chat-header {
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 26px;
    border-bottom:1px solid var(--card-border);
    background: rgba(5,8,7,0.5);
    backdrop-filter: blur(20px);
  }
  .header-info { display:flex; align-items:center; gap:14px; }
  .header-avatars {
    display:flex; position:relative;
    width:56px; height:44px;
  }
  .header-avatars .av {
    width:38px; height:38px; border-radius:50%;
    position:absolute; top:3px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    border:2px solid #050807;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
  .header-avatars .av:first-child {
    right:0;
    background: linear-gradient(135deg, #2575fc, #6a11cb);
  }
  .header-avatars .av:last-child {
    left:0;
    background: linear-gradient(135deg, #ff0080, #ffd93d);
  }
  .header-text h1 {
    font-size:16px; font-weight:800;
    color: var(--text-primary);
    margin-bottom:2px;
  }
  .header-text .sub {
    font-size:11px; color: var(--text-secondary);
    display:flex; align-items:center; gap:5px;
  }
  .header-text .sub::before {
    content:''; width:6px; height:6px; border-radius:50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  /* Messages */
  .messages-scroll {
    flex:1;
    overflow-y:auto;
    padding: 24px 26px;
    display:flex; flex-direction:column; gap:4px;
    scroll-behavior: smooth;
  }
  .messages-scroll::-webkit-scrollbar { width:8px; }
  .messages-scroll::-webkit-scrollbar-thumb {
    background: var(--accent-1); border-radius:4px;
  }
  .messages-scroll::-webkit-scrollbar-track { background: transparent; }

  .empty-state {
    flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:16px; text-align:center;
    color: var(--text-secondary);
    padding:40px;
  }
  .empty-state .big {
    font-size:72px; opacity:.4;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px var(--accent-glow));
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .empty-state h3 {
    color: var(--text-primary);
    font-size:18px; font-weight:700;
  }
  .empty-state p { font-size:13px; max-width:280px; line-height:1.6; }

  .msg-row {
    display:flex;
    gap:10px;
    margin-bottom:12px;
    animation: msgIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes msgIn { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)} }
  .msg-row.mine { flex-direction: row-reverse; }

  .msg-avatar {
    width:36px; height:36px; border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
  }
  .msg-avatar.yusuf {
    background: linear-gradient(135deg, #2575fc, #6a11cb);
  }
  .msg-avatar.zoz {
    background: linear-gradient(135deg, #ff0080, #ffd93d);
  }

  .msg-content {
    display:flex; flex-direction:column;
    gap:4px;
    max-width: 70%;
    min-width:0;
  }
  .msg-row.mine .msg-content { align-items: flex-end; }
  .msg-meta {
    display:flex; align-items:center; gap:6px;
    font-size:11px; color: var(--text-secondary);
    padding: 0 4px;
  }
  .msg-meta b {
    color: var(--accent-1); font-size:12px; font-weight:700;
  }

  .msg-bubble {
    padding: 11px 16px;
    border-radius: 18px;
    font-size:14px; line-height:1.5;
    word-wrap: break-word;
    position:relative;
    transition: transform .2s;
  }
  .msg-row.mine .msg-bubble {
    background: var(--my-msg);
    color: #050807;
    font-weight:600;
    border-bottom-left-radius: 4px;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .msg-row:not(.mine) .msg-bubble {
    background: var(--other-msg);
    color: var(--text-primary);
    border:1px solid var(--card-border);
    border-bottom-right-radius: 4px;
    backdrop-filter: blur(10px);
  }
  .msg-bubble:hover { transform: scale(1.01); }
  .msg-bubble img {
    max-width:100%; border-radius:12px; margin-top:6px;
    display:block; cursor:pointer;
  }
  .msg-bubble.emoji-only { font-size: 34px; line-height:1.2; padding: 6px 14px; }

  .msg-delete {
    position:absolute; top:-6px; left:-6px;
    width:22px; height:22px; border-radius:50%;
    background: var(--error); color:#fff; border:none;
    cursor:pointer;
    display:none; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    z-index:2;
  }
  .msg-row.mine:hover .msg-delete { display:flex; }

  .day-divider {
    align-self:center;
    padding: 5px 16px;
    border-radius: 20px;
    background: rgba(0,255,136,0.08);
    border:1px solid rgba(0,255,136,0.2);
    color: var(--accent-1);
    font-size:11px; font-weight:600;
    margin: 16px 0;
  }

  /* Input */
  .chat-input-area {
    padding: 16px 26px;
    border-top:1px solid var(--card-border);
    background: rgba(5,8,7,0.5);
    backdrop-filter: blur(20px);
  }
  .input-row {
    display:flex; gap:10px; align-items:flex-end;
  }
  .attach-btn {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--input-bg);
    border:1px solid var(--input-border);
    color: var(--text-secondary);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size: 18px;
    transition: all .3s; flex-shrink:0;
  }
  .attach-btn:hover {
    color: var(--accent-1);
    border-color: var(--accent-1);
    background: rgba(0,255,136,0.08);
  }

  .input-wrap {
    flex:1;
    display:flex; align-items:flex-end;
    background: var(--input-bg);
    border:1.5px solid var(--input-border);
    border-radius: 14px;
    padding: 6px 6px 6px 14px;
    transition: border-color .3s;
  }
  .input-wrap:focus-within {
    border-color: var(--accent-1);
    box-shadow: 0 0 0 3px rgba(0,255,136,0.12);
  }
  .chat-input {
    flex:1;
    background: transparent;
    border:none; outline:none;
    color: var(--text-primary);
    font-family: inherit;
    font-size:14px;
    padding: 9px 4px;
    resize: none;
    max-height: 120px;
    min-height: 26px;
    line-height: 1.5;
  }
  .chat-input::placeholder {
    color: var(--text-secondary);
    opacity: .6;
  }

  .emoji-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: transparent; border:none;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size: 19px;
    transition: background .2s;
  }
  .emoji-btn:hover { background: rgba(0,255,136,0.1); }

  .send-btn {
    width: 50px; height: 46px;
    border-radius: 12px;
    background: var(--my-msg);
    color: #050807;
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size: 20px;
    font-weight: 800;
    transition: all .3s; flex-shrink:0;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .send-btn:hover:not(:disabled) {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 24px var(--accent-glow);
  }
  .send-btn:disabled {
    opacity:.4;
    cursor:not-allowed;
    box-shadow: none;
  }

  /* Emoji picker */
  .emoji-picker {
    position:absolute;
    bottom: 90px; left: 26px;
    width: 320px; max-height: 280px;
    background: var(--card-bg);
    border:1px solid var(--card-border);
    border-radius: 16px;
    backdrop-filter: blur(30px);
    box-shadow: var(--shadow);
    padding: 12px;
    display:none;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    overflow-y:auto;
    z-index: 20;
  }
  .emoji-picker.show { display:grid; }
  .emoji-picker button {
    background: transparent; border:none;
    font-size: 22px; cursor:pointer;
    padding: 6px; border-radius: 8px;
    transition: background .2s;
  }
  .emoji-picker button:hover {
    background: rgba(0,255,136,0.15);
    transform: scale(1.2);
  }

  @media (max-width: 768px) {
    .chat-wrap { padding: 0; }
    .chat-app {
      grid-template-columns: 1fr;
      border-radius: 0;
      width:100vw; height:100vh; max-width:none;
    }
    .sidebar { display:none; }
    .msg-content { max-width: 82%; }
    .emoji-picker { left: 10px; right: 10px; width:auto; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="toast-container" id="toastContainer"></div>
<div class="img-modal" id="imgModal"><img id="imgModalSrc" alt=""></div>

<div class="chat-wrap">
  <div class="chat-app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">💚</div>
        <div class="brand-text">
          <h2>يوسف & زوتي</h2>
          <p>محادثة خاصة</p>
        </div>
      </div>

      <div class="me-card">
        <div class="me-avatar" id="meAvatar">👦</div>
        <div class="me-info">
          <b id="meName">يوسف</b>
          <span>أنت الآن</span>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="num" id="daysTogether">0</div>
          <div class="lbl">يوم معاً</div>
        </div>
        <div class="stat-box">
          <div class="num" id="msgCount">0</div>
          <div class="lbl">رسالة</div>
        </div>
      </div>

      <div class="sidebar-actions">
        <button class="sb-btn" id="switchUser">
          <span class="ico">🔄</span>
          <span>تبديل المستخدم</span>
        </button>
        <button class="sb-btn" id="clearChat">
          <span class="ico">🗑️</span>
          <span>مسح المحادثة</span>
        </button>
        <button class="sb-btn danger" id="logoutBtn">
          <span class="ico">🚪</span>
          <span>تسجيل الخروج</span>
        </button>
      </div>
    </aside>

    <!-- Chat Main -->
    <main class="chat-main">
      <div class="chat-header">
        <div class="header-info">
          <div class="header-avatars">
            <div class="av">👦</div>
            <div class="av">👧</div>
          </div>
          <div class="header-text">
            <h1>يوسف & زوتي</h1>
            <div class="sub">متصل الآن</div>
          </div>
        </div>
      </div>

      <div class="messages-scroll" id="messagesScroll">
        <div class="empty-state" id="emptyState">
          <div class="big">💚</div>
          <h3>ابدأوا قصتكم</h3>
          <p>اكتب أول رسالة وابدأ حكايتكم 💕</p>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="input-row">
          <button class="attach-btn" id="attachBtn" title="إرفاق صورة">📷</button>
          <input type="file" id="fileInput" accept="image/*" style="display:none">
          <div class="input-wrap">
            <textarea class="chat-input" id="chatInput" placeholder="اكتب رسالتك..." rows="1"></textarea>
            <button class="emoji-btn" id="emojiBtn">😊</button>
          </div>
          <button class="send-btn" id="sendBtn" disabled>➤</button>
        </div>
      </div>

      <div class="emoji-picker" id="emojiPicker"></div>
    </main>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, onSnapshot,
    serverTimestamp, deleteDoc, doc, getDocs, limit
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBFY0oiMhhd6w4F2Ffa-LgoJADYys_ombg",
    authDomain: "thank-47a5b.firebaseapp.com",
    projectId: "thank-47a5b",
    storageBucket: "thank-47a5b.firebasestorage.app",
    messagingSenderId: "1024740732876",
    appId: "1:1024740732876:web:4f2a3486a8e86c25edf769"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  const START_DATE = new Date('2026-03-27');
  const $ = id => document.getElementById(id);

  // ===== حماية: لازم يكون فيه مستخدم مختار =====
  const currentUser = localStorage.getItem('current_user');
  const currentEmoji = localStorage.getItem('current_emoji') || '👦';
  const authVerified = localStorage.getItem('auth_verified');

  if (!currentUser || !authVerified) {
    window.location.href = 'auth.html';
  }

  // ===== UI Setup =====
  $('meName').textContent = currentUser;
  $('meAvatar').textContent = currentEmoji;

  // ===== Toast =====
  const toast = (msg, type='info', dur=3000) => {
    const icons = { success:'✅', error:'❌', info:'ℹ️' };
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
    $('toastContainer').appendChild(t);
    setTimeout(() => {
      t.style.animation = 'toastOut .4s forwards';
      setTimeout(() => t.remove(), 400);
    }, dur);
  };

  // ===== Days Counter =====
  function updateDays() {
    const now = new Date();
    const diff = Math.floor((now - START_DATE) / (1000 * 60 * 60 * 24));
    $('daysTogether').textContent = Math.max(0, diff).toLocaleString('ar-EG');
  }
  updateDays();
  setInterval(updateDays, 60000);

  // ===== Messages =====
  let unsubMessages = null;
  let isFirstLoad = true;

  function listenMessages() {
    const q = query(collection(db, 'couple_messages'), orderBy('createdAt', 'asc'), limit(500));
    unsubMessages = onSnapshot(q, snap => {
      const msgs = [];
      snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
      renderMessages(msgs, isFirstLoad);
      if (isFirstLoad) isFirstLoad = false;
      $('msgCount').textContent = msgs.length.toLocaleString('ar-EG');
    }, err => {
      console.error('Firestore error:', err);
      toast('خطأ في تحميل الرسائل: ' + err.code, 'error', 5000);
    });
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  }

  function formatDay(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const sameDay = (a,b) => a.toDateString() === b.toDateString();
    if (sameDay(d, today)) return 'اليوم';
    if (sameDay(d, yesterday)) return 'أمس';
    return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function renderMessages(msgs, silent = false) {
    const scroll = $('messagesScroll');
    const wasAtBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 100;
    const empty = $('emptyState');

    if (!msgs.length) {
      if (empty) empty.style.display = 'flex';
      scroll.querySelectorAll('.msg-row, .day-divider').forEach(e => e.remove());
      return;
    }
    if (empty) empty.style.display = 'none';

    let lastDay = '';
    let html = '';
    msgs.forEach(m => {
      const day = formatDay(m.createdAt);
      if (day && day !== lastDay) {
        html += `<div class="day-divider">${day}</div>`;
        lastDay = day;
      }
      const mine = m.sender === currentUser;
      const senderEmoji = m.sender === 'يوسف' ? '👦' : '👧';
      const avatarClass = m.sender === 'يوسف' ? 'yusuf' : 'zoz';
      const text = m.text ? escapeHtml(m.text) : '';
      const img = m.imageUrl ? `<img src="${m.imageUrl}" onclick="showImage('${m.imageUrl}')" alt="">` : '';
      const isEmoji = m.text && /^\p{Emoji}+$/u.test(m.text.trim());
      const bubbleClass = isEmoji ? 'msg-bubble emoji-only' : 'msg-bubble';

      html += `
        <div class="msg-row ${mine ? 'mine' : ''}">
          <div class="msg-avatar ${avatarClass}">${senderEmoji}</div>
          <div class="msg-content">
            <div class="msg-meta">
              <b>${mine ? 'أنت' : escapeHtml(m.sender || '')}</b>
              <span>${formatTime(m.createdAt)}</span>
            </div>
            <div class="${bubbleClass}">
              ${text}${img}
              ${mine ? `<button class="msg-delete" onclick="deleteMsg('${m.id}')">×</button>` : ''}
            </div>
          </div>
        </div>`;
    });

    scroll.querySelectorAll('.msg-row, .day-divider').forEach(e => e.remove());
    scroll.insertAdjacentHTML('beforeend', html);
    if (wasAtBottom || silent) scroll.scrollTop = scroll.scrollHeight;
  }

  // ===== Image Modal =====
  window.showImage = url => {
    $('imgModalSrc').src = url;
    $('imgModal').classList.add('show');
  };
  $('imgModal').addEventListener('click', () => $('imgModal').classList.remove('show'));

  // ===== Delete Message =====
  window.deleteMsg = async id => {
    if (!confirm('حذف الرسالة؟')) return;
    try {
      const msgRef = doc(db, 'couple_messages', id);
      const snap = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
        .then(m => m.getDoc(msgRef));
      if (snap.exists() && snap.data().sender === currentUser) {
        await deleteDoc(msgRef);
        toast('تم الحذف', 'success', 1500);
      }
    } catch (e) {
      toast('فشل الحذف', 'error');
    }
  };

  // ===== Send Message =====
  const chatInput = $('chatInput');
  const sendBtn = $('sendBtn');

  chatInput.addEventListener('input', () => {
    sendBtn.disabled = !chatInput.value.trim();
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
  });

  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || !currentUser) return;

    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendBtn.disabled = true;

    try {
      await addDoc(collection(db, 'couple_messages'), {
        text,
        sender: currentUser,
        createdAt: serverTimestamp()
      });
      $('messagesScroll').scrollTop = $('messagesScroll').scrollHeight;
    } catch (e) {
      console.error(e);
      toast('فشل الإرسال: ' + e.code, 'error');
      chatInput.value = text;
      sendBtn.disabled = false;
    }
  }

  // ===== Attach Image =====
  $('attachBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;

    if (file.size > 3 * 1024 * 1024) {
      toast('الصورة كبيرة (3MB كحد أقصى)', 'error');
      return;
    }

    toast('جاري رفع الصورة...', 'info', 2000);

    try {
      const storageRef = ref(storage, `couple/${Date.now()}_${file.name}`);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);

      await addDoc(collection(db, 'couple_messages'), {
        imageUrl: url,
        text: '',
        sender: currentUser,
        createdAt: serverTimestamp()
      });

      toast('تم إرسال الصورة', 'success', 1500);
    } catch (err) {
      console.error(err);
      toast('فشل رفع الصورة: ' + err.code, 'error');
    }
    e.target.value = '';
  });

  // ===== Emojis =====
  const emojis = ['💚','💚','💕','💖','💗','💓','💘','💝','💞','❤️','😀','😃','😄','😁','😆','😅','🤣','😂','🙂','🙃','😉','😊','😇','🥰','😍','🤩','😘','😗','😚','😙','🥲','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐','🤨','😐','😑','😶','😏','😒','🙄','😬','🤥','😌','😔','😪','🤤','😴','😷','🤒','🤕','🤢','🤮','🤧','🥵','🥶','🥴','😵','🤯','🤠','🥳','😎','🤓','🧐','😕','😟','🙁','😮','😯','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞','😓','😩','😫','🥱','😤','😡','😠','🤬','😈','💀','💩','🤡','👻','👽','🤖','💯','🔥','✨','⭐','💫','⚡','💥','💢','💦','💨','🌹','🌸','🌺','🌻','🌷','🌈','☀️','🌙','⛅','☁️','🌧️','❄️','🍀','💎','🔮','🎁','🎈','🎉','🎊','🏆','🥇','🎯','🎵','☕','🍕','🍔','🍟','🍎','🍓','🍩','🍫','👍','👎','👌','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','👇','☝️','✋','🤚','🖐️','🖖','👋','🤝','🙏','💪','💍','💐','🕊️','👑','💌','🎀','💋','🫶','🫰'];

  const emojiPicker = $('emojiPicker');
  emojiPicker.innerHTML = emojis.map(e => `<button type="button">${e}</button>`).join('');
  emojiPicker.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      chatInput.value += btn.textContent;
      chatInput.focus();
      sendBtn.disabled = false;
      emojiPicker.classList.remove('show');
    });
  });

  $('emojiBtn').addEventListener('click', e => {
    e.stopPropagation();
    emojiPicker.classList.toggle('show');
  });

  document.addEventListener('click', e => {
    if (!emojiPicker.contains(e.target) && e.target.id !== 'emojiBtn') {
      emojiPicker.classList.remove('show');
    }
  });

  // ===== Sidebar Actions =====
  $('switchUser').addEventListener('click', () => {
    if (!confirm('تبديل المستخدم؟')) return;
    localStorage.removeItem('current_user');
    localStorage.removeItem('current_emoji');
    window.location.href = 'auth.html';
  });

  $('clearChat').addEventListener('click', async () => {
    if (!confirm('مسح كل الرسائل؟ لا يمكن التراجع!')) return;
    try {
      const snap = await getDocs(collection(db, 'couple_messages'));
      const promises = [];
      snap.forEach(d => promises.push(deleteDoc(d.ref)));
      await Promise.all(promises);
      toast('تم مسح المحادثة', 'success');
    } catch (e) {
      toast('فشل المسح', 'error');
    }
  });

  $('logoutBtn').addEventListener('click', () => {
    if (!confirm('تسجيل الخروج؟')) return;
    localStorage.removeItem('current_user');
    localStorage.removeItem('current_emoji');
    localStorage.removeItem('auth_verified');
    window.location.href = 'auth.html';
  });

  // ===== Init =====
  listenMessages();
</script>
</body>
  </html>
