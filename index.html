<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💚 يوسف & زوتي — الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #050807;
    --bg-deep: #0a120d;
    --card-bg: rgba(0, 255, 136, 0.04);
    --card-border: rgba(0, 255, 136, 0.15);
    --text-primary: #e8fff5;
    --text-secondary: rgba(232, 255, 245, 0.55);
    --input-bg: rgba(0, 255, 136, 0.04);
    --input-border: rgba(0, 255, 136, 0.18);
    --accent-1: #00ff88;
    --accent-2: #00cc6a;
    --accent-3: #0aff9d;
    --accent-glow: rgba(0, 255, 136, 0.4);
    --success: #00ff88;
    --error: #ff4757;
    --shadow: 0 25px 70px rgba(0, 255, 136, 0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
  html, body { min-height:100vh; overflow:hidden; background:var(--bg-base); }

  /* خلفية متحركة */
  .bg-grid {
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 50px 50px; }
  }
  .bg-glow {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,255,136,0.12) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,204,106,0.1) 0%, transparent 40%);
    animation: glowPulse 6s ease-in-out infinite alternate;
  }
  @keyframes glowPulse { from{opacity:.5} to{opacity:1} }

  /* نجوم/جزيئات */
  .particles { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .particle {
    position:absolute; width:2px; height:2px; background:var(--accent-1);
    border-radius:50%; box-shadow:0 0 6px var(--accent-1);
    animation: particleFloat linear infinite;
  }
  @keyframes particleFloat {
    0% { transform: translateY(100vh) translateX(0); opacity:0; }
    10% { opacity:1; }
    90% { opacity:1; }
    100% { transform: translateY(-10vh) translateX(50px); opacity:0; }
  }

  /* Splash */
  .splash {
    position:fixed; inset:0; z-index:9999; background:var(--bg-base);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: opacity .8s, visibility .8s;
  }
  .splash.hide { opacity:0; visibility:hidden; }
  .splash-logo {
    font-family:'Dancing Script',cursive; font-size:64px; font-weight:700;
    background:linear-gradient(135deg,#00ff88,#0aff9d,#00cc6a);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    animation: logoPulse 1.5s infinite; filter:drop-shadow(0 0 30px var(--accent-glow));
  }
  @keyframes logoPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  .splash-bar {
    width:200px; height:3px; background:rgba(0,255,136,0.1);
    border-radius:2px; margin-top:30px; overflow:hidden;
  }
  .splash-bar::after {
    content:''; display:block; height:100%; width:40%;
    background:linear-gradient(90deg,transparent,var(--accent-1),transparent);
    animation: splashLoad 1.5s ease-in-out infinite;
  }
  @keyframes splashLoad { 0%{transform:translateX(400%)} 100%{transform:translateX(-250%)} }

  /* Auth */
  .auth-wrap {
    position:relative; z-index:10; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
    transition: opacity .6s, transform .6s;
  }
  .auth-wrap.hidden { opacity:0; transform:scale(.95); pointer-events:none; position:absolute; inset:0; }

  .login-card {
    width:440px; max-width:92vw; padding:50px 44px 40px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:24px;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
    position:relative;
    animation: cardIn 1.2s cubic-bezier(.34,1.56,.64,1);
    overflow:hidden;
  }
  .login-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent-1), transparent);
    animation: topGlow 3s ease-in-out infinite;
  }
  @keyframes topGlow { 0%,100%{opacity:.3} 50%{opacity:1} }
  @keyframes cardIn { from{opacity:0; transform:translateY(40px) scale(.95)} to{opacity:1; transform:translateY(0) scale(1)} }

  .card-header { text-align:center; margin-bottom:36px; }
  .card-icon {
    width:72px; height:72px; margin:0 auto 18px;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    font-size:32px;
    box-shadow:0 10px 30px var(--accent-glow);
    animation: iconFloat 3s ease-in-out infinite;
  }
  @keyframes iconFloat { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-6px) rotate(5deg)} }
  .card-header h1 {
    font-family:'Dancing Script',cursive; font-size:34px; font-weight:700;
    background:linear-gradient(135deg,#00ff88,#0aff9d,#00cc6a);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    margin-bottom:6px; filter:drop-shadow(0 0 20px rgba(0,255,136,.3));
  }
  .card-header p { color: var(--text-secondary); font-size:13px; letter-spacing:0.5px; }

  .input-group { position:relative; margin-bottom:20px; }
  .input-group label {
    display:block; color:var(--text-secondary); font-size:12px; font-weight:600;
    margin-bottom:8px; padding-right:4px;
    text-transform:uppercase; letter-spacing:1px;
  }
  .input-group input {
    width:100%; padding:15px 46px 15px 16px;
    background: var(--input-bg);
    border:1.5px solid var(--input-border);
    border-radius:12px;
    color: var(--text-primary); font-size:15px; outline:none;
    transition: all .3s;
    font-family: inherit;
  }
  .input-group input::placeholder { color: var(--text-secondary); opacity:.5; }
  .input-group input:focus {
    border-color: var(--accent-1);
    background: rgba(0,255,136,0.06);
    box-shadow: 0 0 0 3px rgba(0,255,136,0.12);
  }
  .input-group .field-icon {
    position:absolute; left:16px; bottom:15px;
    font-size:18px; pointer-events:none; opacity:.7;
  }

  .error-msg {
    font-size:12px; color: var(--error);
    padding-right:4px;
    max-height:0; overflow:hidden; opacity:0;
    transition: all .3s;
    display:flex; align-items:center; gap:6px;
    margin-top:-12px;
  }
  .error-msg.show { max-height:40px; opacity:1; margin-bottom:16px; margin-top:-8px; }

  .remember-row {
    display:flex; align-items:center; gap:8px; margin-bottom:24px;
    font-size:13px; color:var(--text-secondary);
  }
  .remember-row input[type="checkbox"] {
    appearance:none; width:18px; height:18px;
    border:1.5px solid var(--input-border); border-radius:5px;
    cursor:pointer; position:relative; transition:all .25s;
    background: transparent;
  }
  .remember-row input[type="checkbox"]:checked {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-color: transparent;
  }
  .remember-row input[type="checkbox"]:checked::after {
    content:'✓'; position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#050807; font-size:12px; font-weight:900;
  }
  .remember-row label { cursor:pointer; user-select:none; }

  .btn-primary {
    width:100%; padding:16px; border:none; border-radius:12px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    background-size: 200% 200%;
    color: #050807; font-size:16px; font-weight:800;
    cursor:pointer; transition: all .4s;
    box-shadow: 0 10px 30px var(--accent-glow);
    display:flex; align-items:center; justify-content:center; gap:10px;
    letter-spacing: 0.5px;
    position:relative; overflow:hidden;
  }
  .btn-primary:hover:not(:disabled) {
    background-position: 100% 0;
    transform: translateY(-2px);
    box-shadow: 0 15px 40px var(--accent-glow);
  }
  .btn-primary::before {
    content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
    transition: left .6s;
  }
  .btn-primary:hover::before { left:100%; }
  .btn-primary:disabled { opacity:.6; cursor:not-allowed; }
  .loader {
    width:18px; height:18px;
    border:2.5px solid rgba(5,8,7,0.2); border-top-color: #050807;
    border-radius:50%; animation: spin .7s linear infinite; display:none;
  }
  .btn-primary.loading .loader { display:inline-block; }
  @keyframes spin { to{transform:rotate(360deg)} }

  .security-note {
    text-align:center; margin-top:24px; padding-top:20px;
    border-top:1px solid var(--card-border);
    color: var(--text-secondary); font-size:11px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .security-note .lock { color: var(--accent-1); }

  /* Who are you */
  .who-wrap {
    position:relative; z-index:10; min-height:100vh; display:none;
    align-items:center; justify-content:center; padding:20px;
  }
  .who-wrap.active { display:flex; animation: cardIn .7s cubic-bezier(.34,1.56,.64,1); }

  .who-card {
    width:560px; max-width:92vw; padding:50px 40px;
    text-align:center;
    background: var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:24px;
    backdrop-filter: blur(30px) saturate(180%);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .who-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent-1), transparent);
    animation: topGlow 3s ease-in-out infinite;
  }
  .who-card h2 {
    font-family:'Dancing Script',cursive; font-size:38px; font-weight:700;
    background:linear-gradient(135deg,#00ff88,#0aff9d,#00cc6a);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    margin-bottom:8px;
  }
  .who-card > p { color: var(--text-secondary); font-size:14px; margin-bottom:36px; }

  .who-buttons {
    display: grid; grid-template-columns: 1fr 1fr; gap:18px;
  }
  .who-btn {
    padding:32px 24px;
    background: var(--input-bg);
    border:2px solid var(--input-border);
    border-radius: 18px;
    cursor:pointer;
    transition: all .4s cubic-bezier(.34,1.56,.64,1);
    font-family: inherit; color: var(--text-primary);
    position: relative;
    overflow: hidden;
  }
  .who-btn::before {
    content:''; position:absolute; inset:0;
    background: radial-gradient(circle at 50% 0%, rgba(0,255,136,0.15), transparent 70%);
    opacity:0; transition: opacity .4s;
  }
  .who-btn:hover::before { opacity:1; }
  .who-btn:hover {
    transform: translateY(-8px);
    border-color: var(--accent-1);
    box-shadow: 0 20px 50px var(--accent-glow);
  }
  .who-btn .who-emoji {
    font-size:64px; display:block; margin-bottom:14px;
    filter: drop-shadow(0 8px 20px rgba(0,255,136,.3));
    transition: transform .4s;
  }
  .who-btn:hover .who-emoji { transform: scale(1.15) rotate(-5deg); }
  .who-btn .who-name {
    font-size:22px; font-weight:800; margin-bottom:4px;
    color: var(--accent-1); letter-spacing:0.5px;
  }
  .who-btn .who-desc { font-size:12px; color: var(--text-secondary); }

  @media (max-width: 480px) {
    .login-card { padding:40px 28px 32px; }
    .card-header h1 { font-size:28px; }
    .who-buttons { grid-template-columns: 1fr; }
    .who-card { padding:40px 28px; }
    .who-card h2 { font-size:30px; }
  }
</style>
</head>
<body>

<!-- Splash -->
<div class="splash" id="splash">
  <div class="splash-logo">Y & Z</div>
  <div class="splash-bar"></div>
</div>

<!-- Background -->
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>

<!-- AUTH -->
<div class="auth-wrap" id="authWrap">
  <div class="login-card">
    <div class="card-header">
      <div class="card-icon">💚</div>
      <h1>يوسف & زوتي</h1>
      <p>مساحتنا الخاصة</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="ادخل بريدك" autocomplete="email">
        <span class="field-icon">✉️</span>
      </div>
      <div class="error-msg" id="emailError">⚠️ <span></span></div>

      <div class="input-group">
        <label>كلمة السر</label>
        <input type="password" id="password" placeholder="ادخل كلمة السر" autocomplete="current-password">
        <span class="field-icon" id="togglePass" style="cursor:pointer;pointer-events:auto">👁️</span>
      </div>
      <div class="error-msg" id="passError">⚠️ <span></span></div>

      <div class="remember-row">
        <input type="checkbox" id="remember" checked>
        <label for="remember">تذكرني على هذا الجهاز</label>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        <span class="loader"></span>
        <span id="submitText">دخول</span>
      </button>
    </form>

    <div class="security-note">
      <span class="lock">🔒</span>
      <span>مكان خاص لشخصين فقط</span>
    </div>
  </div>
</div>

<!-- WHO ARE YOU -->
<div class="who-wrap" id="whoWrap">
  <div class="who-card">
    <h2>مين اللي بيدخل؟</h2>
    <p>اختار عشان نعرف مين بيبعت</p>
    <div class="who-buttons">
      <button class="who-btn" data-user="يوسف" data-emoji="👦">
        <span class="who-emoji">👦</span>
        <span class="who-name">يوسف</span>
        <span class="who-desc">قلبها 💙</span>
      </button>
      <button class="who-btn" data-user="زوتي" data-emoji="👧">
        <span class="who-emoji">👧</span>
        <span class="who-name">زوتي</span>
        <span class="who-desc">قلبه 💗</span>
      </button>
    </div>
  </div>
</div>

<script>
  // ===== بيانات الحساب =====
  const COUPLE_EMAIL = 'zozyuozo3272@gmail.com';
  const COUPLE_PASSWORD = 'joozoo327#';
  const NEXT_PAGE = 'chat.html'; // صفحة الشات

  const $ = id => document.getElementById(id);

  // ===== Splash =====
  window.addEventListener('load', () => {
    setTimeout(() => $('splash').classList.add('hide'), 1800);
  });

  // ===== Particles =====
  (function spawnParticles() {
    const container = $('particles');
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
      container.appendChild(p);
    }
  })();

  // ===== Toggle Password =====
  $('togglePass').addEventListener('click', () => {
    const p = $('password');
    if (p.type === 'password') {
      p.type = 'text';
      $('togglePass').textContent = '🙈';
    } else {
      p.type = 'password';
      $('togglePass').textContent = '👁️';
    }
  });

  // ===== Login =====
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('email').value.trim().toLowerCase();
    const pass = $('password').value;

    $('emailError').classList.remove('show');
    $('passError').classList.remove('show');

    if (email !== COUPLE_EMAIL.toLowerCase()) {
      $('emailError').querySelector('span').textContent = 'هذا ليس بريدنا';
      $('emailError').classList.add('show');
      return;
    }

    if (pass !== COUPLE_PASSWORD) {
      $('passError').querySelector('span').textContent = 'كلمة السر غير صحيحة';
      $('passError').classList.add('show');
      return;
    }

    const btn = $('submitBtn');
    btn.classList.add('loading');
    btn.disabled = true;
    $('submitText').textContent = 'جاري الدخول...';

    await new Promise(r => setTimeout(r, 1200));

    // لو فيه مستخدم مختار من قبل، ندخل على طول
    const savedUser = localStorage.getItem('current_user');
    if (savedUser) {
      window.location.href = NEXT_PAGE;
      return;
    }

    // نروح لصفحة الاختيار
    $('authWrap').classList.add('hidden');
    $('whoWrap').classList.add('active');
  });

  // ===== Choose User =====
  document.querySelectorAll('.who-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const user = btn.dataset.user;
      const emoji = btn.dataset.emoji;
      localStorage.setItem('current_user', user);
      localStorage.setItem('current_emoji', emoji);
      localStorage.setItem('auth_verified', 'true');
      window.location.href = NEXT_PAGE;
    });
  });

  // ===== Autofill email لو محفوظ =====
  const savedEmail = localStorage.getItem('last_email');
  if (savedEmail) {
    $('email').value = savedEmail;
    $('password').focus();
  }
  $('email').addEventListener('blur', () => {
    if ($('email').value.trim()) {
      localStorage.setItem('last_email', $('email').value.trim());
    }
  });
</script>
</body>
</html>
